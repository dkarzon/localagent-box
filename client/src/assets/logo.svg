<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer box -->
  <rect x="20" y="20" width="200" height="200" rx="18" ry="18"
        fill="#0D0D0D" stroke="#8b5cf6" stroke-width="6"/>

  <!-- Inner robot head -->
  <rect x="70" y="70" width="100" height="80" rx="12" ry="12"
        fill="#1A1A1A" stroke="#8b5cf6" stroke-width="5"/>

  <!-- Robot eyes -->
  <circle cx="100" cy="105" r="10" fill="#8b5cf6"/>
  <circle cx="140" cy="105" r="10" fill="#8b5cf6"/>

  <!-- Robot mouth -->
  <rect x="95" y="130" width="50" height="10" rx="4" ry="4" fill="#8b5cf6"/>

  <!-- Antenna -->
  <line x1="120" y1="70" x2="120" y2="45" stroke="#8b5cf6" stroke-width="5"/>
  <circle cx="120" cy="40" r="8" fill="#8b5cf6"/>

  <!-- Git branch icon connecting to robot -->
  <circle cx="58" cy="188" r="10" fill="#8b5cf6"/>
  <circle cx="100" cy="168" r="10" fill="#8b5cf6"/>
  <line x1="58" y1="188" x2="100" y2="168" stroke="#8b5cf6" stroke-width="5" stroke-linecap="round"/>
  <line x1="100" y1="168" x2="100" y2="150" stroke="#8b5cf6" stroke-width="5" stroke-linecap="round"/>
</svg>
