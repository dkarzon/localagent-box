<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer box -->
  <rect x="8" y="8" width="224" height="224" rx="20" ry="20"
        fill="#0D0D0D" stroke="#8b5cf6" stroke-width="6"/>

  <!-- Inner robot head -->
  <rect x="60" y="62" width="120" height="96" rx="14" ry="14"
        fill="#1A1A1A" stroke="#8b5cf6" stroke-width="9"/>

  <!-- Robot eyes -->
  <circle cx="96" cy="102" r="12" fill="#8b5cf6"/>
  <circle cx="144" cy="102" r="12" fill="#8b5cf6"/>

  <!-- Robot mouth -->
  <rect x="90" y="130" width="60" height="12" rx="5" ry="5" fill="#8b5cf6"/>

  <!-- Antenna -->
  <line x1="120" y1="62" x2="120" y2="36" stroke="#8b5cf6" stroke-width="9"/>
  <circle cx="120" cy="30" r="9" fill="#8b5cf6"/>

  <!-- Git branch icon connecting to robot -->
  <circle cx="52" cy="202" r="10" fill="#8b5cf6"/>
  <circle cx="96" cy="180" r="10" fill="#8b5cf6"/>
  <line x1="52" y1="202" x2="96" y2="180" stroke="#8b5cf6" stroke-width="9" stroke-linecap="round"/>
  <line x1="96" y1="180" x2="96" y2="158" stroke="#8b5cf6" stroke-width="9" stroke-linecap="round"/>
</svg>
