services:
  localagent-box:
    build: .
    image: localagent-box
    container_name: localagent-box
    restart: unless-stopped
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: "8080"
      DATA_DIR: "/data"
      MAX_CONCURRENT_AGENTS: "3"
      AGENT_TIMEOUT: "3600"
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      API_TOKEN: ${API_TOKEN:-localagent-box}
      # Expose the codegraph MCP server to agents (set to "true" to enable).
      ENABLE_CODEGRAPH: ${ENABLE_CODEGRAPH:-}
      # Workspace bootstrap profile gate (P2-T4).
      # BOOTSTRAP_AUTO_DETECT: "true" to auto-detect lockfiles without .localagent-box/environment.json.
      # BOOTSTRAP_SETUP_TIMEOUT_MS: global override for setup.timeoutMs (ms).
      BOOTSTRAP_AUTO_DETECT: ${BOOTSTRAP_AUTO_DETECT:-}
      BOOTSTRAP_SETUP_TIMEOUT_MS: ${BOOTSTRAP_SETUP_TIMEOUT_MS:-}
      # Dependency cache (P3-T1): persisted under the agent-data volume so node_modules/.venv survive runs.
      # Root defaults to /data/dep-cache when DEP_CACHE_ROOT is unset.
      DEP_CACHE_ENABLED: ${DEP_CACHE_ENABLED:-false}
      DEP_CACHE_ROOT: ${DEP_CACHE_ROOT:-}
    volumes:
      - agent-data:/data
      - agent-workspace:/workspace

volumes:
  agent-data:
  agent-workspace:
