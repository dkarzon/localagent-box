services:
  localagent-box:
    build: .
    image: localagent-box
    container_name: localagent-box
    restart: unless-stopped
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: "8080"
      DATA_DIR: "/data"
      MAX_CONCURRENT_AGENTS: "3"
      AGENT_TIMEOUT: "3600"
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      API_TOKEN: ${API_TOKEN:-localagent-box}
      # Expose the code-review-graph MCP server to agents (set to "true" to enable).
      ENABLE_CODE_REVIEW_GRAPH: ${ENABLE_CODE_REVIEW_GRAPH:-}
      # Comma-separated MCP tool allowlist; "*" exposes all 30 tools. Default: 4 review-focused tools.
      CODE_REVIEW_GRAPH_TOOLS: ${CODE_REVIEW_GRAPH_TOOLS:-}
    volumes:
      - agent-data:/data
      - agent-workspace:/workspace

volumes:
  agent-data:
  agent-workspace:
